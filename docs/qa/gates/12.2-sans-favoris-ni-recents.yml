    monitor:
      - "Le raccourci vers les nœuds qu'on utilise souvent disparaît — c'était l'argument des favoris, et il était réel. Ce qui le remplace : la recherche, qui traverse tout et classe par pertinence, et un index désormais lisible. À rouvrir si le manque se fait sentir à l'usage."
      - "Les préférences client du menu n'existent plus du tout. Si un réglage devait y revenir — l'état de repli persistant, par exemple — le fichier serait à recréer."
