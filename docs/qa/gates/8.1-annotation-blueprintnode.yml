top_issues:
  - id: "ANN-001"
    severity: medium
    finding: "CORRIGÉ — les méthodes n'étaient triées que par nom : deux surcharges annotées se retrouvaient dans l'ordre non spécifié de getDeclaredMethods(), donc un ordre d'enregistrement variable d'un démarrage à l'autre (le hash de registre 6.2 doit être stable)"
    suggested_action: "Fait : tri par nom PUIS signature — ordre total"
  - id: "ANN-002"
    severity: low
    finding: "Une seule sortie par méthode annotée (la valeur de retour) ; les sorties multiples restent au builder"
    suggested_action: "Assumé et documenté : les émuler demanderait des paramètres « boîte » moins lisibles que le builder qu'ils remplacent"
  - id: "ANN-003"
    severity: low
    finding: "Sans le processeur d'annotations, les erreurs de déclaration apparaissent au démarrage du jeu, pas dans javac (AC3 lu au sens « signalées clairement »)"
    suggested_action: "Déviation consignée dans la story ; le binder est conçu pour qu'un processeur v1.1 produise exactement les mêmes NodeType"
  - id: "ANN-004"
    severity: low
    finding: "Le scan des classes déclarées passe par le classloader de Blueprint ; un mod chargé dans un classloader isolé ne serait pas trouvé"
    suggested_action: "Sans objet sur Fabric (classloader partagé) ; l'échec est isolé et journalisé si le cas apparaît"
