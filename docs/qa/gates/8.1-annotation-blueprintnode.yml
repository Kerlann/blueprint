status_reason: "Les pins se déduisent de la signature, le contexte s'injecte, les déclarations fautives sont refusées en nommant la méthode, et un mod peut n'avoir aucune classe de plugin. Un trou de déterminisme trouvé en revue (surcharges) et fermé. Le processeur d'annotations reste une déviation assumée et argumentée."
