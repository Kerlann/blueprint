  - id: "TYPE-001"
    severity: low
    finding: "LiteralValue.of ne valide pas le type des éléments d'un littéral list/map (List.class.isInstance seulement) : LiteralValue.of(list<int>, List.of(\"a\")) passe"
    suggested_action: "Valider récursivement les éléments, ou documenter que le codec est l'autorité au moment de la sérialisation"
  - id: "TYPE-002"
    severity: low
    finding: "Codec.unboundedMap exige des clés représentables en chaîne : un littéral map<blockpos, T> échouera à l'encodage, limitation non documentée"
    suggested_action: "Documenter dans la javadoc de mapOf ; envisager un encodage en liste de paires en story 1.4"
  - id: "TYPE-003"
    severity: low
    finding: "GenericResolution.unify est asymétrique : unify(déclaré=ANY, concret=int) lie, unify(déclaré=int, concret=ANY) échoue — le contrat « déclaré d'abord » n'est écrit nulle part"
    suggested_action: "Préciser le contrat dans la javadoc de unify avant que le validateur (1.3) ne l'appelle"
  - id: "SER-001"
    severity: low
    finding: "Les types paramétrés partagent un id (blueprint:list) : l'id seul ne suffira pas à désérialiser list<int> vs list<string>"
    suggested_action: "Prévoir un encodage structurel des types dans les codecs NBT de la story 1.4 (déjà cohérent avec l'archi, à ne pas oublier)"

