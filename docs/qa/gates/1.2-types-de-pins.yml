  - id: "TEST-001"
    severity: medium
    finding: "CORRIGÉ — NFR13 exigeait ≥ 80 % de couverture sur core sans qu'aucun outil ne la mesure : la cible était invérifiable, donc décorative"
    suggested_action: "Fait : JaCoCo bloquant sur core, puis sur le client en story 5.12. Poser le seuil client a révélé trois pans de logique jamais exercés, dont replaceAll — l'opération la plus destructrice de l'éditeur."
  - id: "TYPE-001"
    severity: low
    finding: "LiteralValue.of ne valide pas le type des éléments d'un littéral list/map (List.class.isInstance seulement) : LiteralValue.of(list<int>, List.of(\"a\")) passe"
    suggested_action: "Assumé : le codec est l'autorité à la sérialisation, et un littéral ne naît que de l'éditeur (typé) ou d'un fichier (décodé, donc validé). Une validation récursive coûterait à chaque frappe pour un cas qu'aucun chemin réel n'atteint."
  - id: "TYPE-002"
    severity: low
    finding: "DOCUMENTÉ — Codec.unboundedMap exige des clés représentables en chaîne : un map<blockpos, T> se construit et se valide, mais échoue à l'encodage. La limitation n'était écrite nulle part."
    suggested_action: "Fait : javadoc de PinTypes.mapOf, avec le contournement (une list de paires)."
  - id: "TYPE-003"
    severity: low
    finding: "DOCUMENTÉ — GenericResolution.unify est asymétrique : unify(déclaré=ANY, concret=int) lie, l'inverse échoue"
    suggested_action: "Fait : contrat « déclaré d'abord » écrit en gras dans la javadoc de unify, avant que le validateur (1.3) ne l'appelle."
  - id: "SER-001"
    severity: low
    finding: "RÉSOLU EN 1.4 — les types paramétrés partagent un id (blueprint:list) : l'id seul n'aurait pas permis de distinguer list<int> de list<string> au décodage"
    suggested_action: "PinTypeNbt encode la STRUCTURE du type (conteneur + arguments), pas son id ; le round-trip est verrouillé par test."

