  risks_without_gate:
    - "Un indice qui vaudrait le rang à l'écran donnerait un clic juste tant qu'on n'a pas défilé, et faux ensuite : le pire des défauts, puisqu'il passe tous les essais rapides."
    - "Un champ de saisie est la seule surface où un joueur écrit du texte libre qui atteint le serveur. Le filtre et la longueur sont revérifiés côté serveur, et un dépassement est ignoré — jamais tronqué."
