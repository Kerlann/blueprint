name: check

# Le filet du quotidien, à côté de `build.yml` qui ne part que sur une étiquette.
#
# Il existe pour une raison précise et vécue : une correction trouvée, vérifiée verte en
# local et annoncée comme faite était en réalité restée hors du commit — le `git add`
# oubliait un dossier. La vérification locale portait donc sur un état que le dépôt
# n'avait pas, et rien ne pouvait le voir sauf une construction qui repart du dépôt.
#
# D'où le partage : ce qui est RAPIDE tourne à chaque push, ce qui est LENT attend une
# étiquette. `./gradlew build` compile les six modules, passe les tests headless, vérifie
# la couverture, l'isolation de l'api, la référence des nœuds et la surface publique —
# une minute environ. Le serveur Minecraft des gametests, lui, reste dans `build.yml`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Annulation ACTIVE, contrairement à `build.yml` : un push qui en remplace un autre rend
  # la construction précédente sans objet. C'est l'inverse d'une étiquette, dont la
  # construction est la seule qui existera pour cette version.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests headless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew build
        run: ./gradlew build --stacktrace

      - name: Rapports de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            */build/reports/tests/test
            */build/test-results/test
          retention-days: 7
