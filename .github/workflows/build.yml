name: build

# La construction COMPLÈTE, gametests compris : elle démarre un vrai serveur Minecraft.
#
# Elle ne part que sur une étiquette de version, sur une publication, ou à la main — c'est
# lent, et un commit ordinaire n'a pas besoin de la payer.
#
# Le quotidien est couvert par `check.yml`, qui tourne à chaque push sur `main` et se
# limite à ce qui est rapide. Les deux ne se marchent pas dessus : un push d'étiquette ne
# correspond pas à `branches: [main]`.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PAS d'annulation, contrairement à avant. Tant que la construction tournait à chaque
  # push, annuler celle d'un commit déjà dépassé était la bonne économie. Une construction
  # d'étiquette, elle, est la seule qui existera jamais pour cette version : l'annuler
  # laisserait une release sans preuve qu'elle compile.
  cancel-in-progress: false

jobs:
  build:
    name: Tests headless
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v4

      # `build` enchaîne : compilation des 6 modules, isolation de l'api, les tests
      # headless, couverture ≥ 80 % sur core et ≥ 82 % sur la partie testable du
      # client, référence des nœuds et surface d'API comparées à ce qui est commité.
      - name: ./gradlew build
        run: ./gradlew build --stacktrace

      - name: Rapports de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            */build/reports/tests/test
            */build/test-results/test
          retention-days: 7

      # Le JAR est conservé : une construction déclenchée par une étiquette produit la
      # version qu'on va distribuer, et la jeter obligerait à refaire tourner la chaîne
      # pour récupérer ce qu'on vient de vérifier.
      - name: Le JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-jar
          path: build/libs/blueprint-*.jar
          retention-days: 90
          if-no-files-found: error

  gametest:
    name: Tests en jeu (serveur réel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Séparé du job précédent : il démarre un vrai serveur Minecraft, il est plus lent
    # et il échoue pour d'autres raisons. Savoir lequel des deux est rouge compte.
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew runGametest
        run: ./gradlew runGametest --stacktrace

      - name: Rapport des gametests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-gametest
          path: build/gametest/report.xml
          retention-days: 7
          if-no-files-found: ignore
