# <!-- Powered by BMAD™ Core -->
markdownExploder: true
qa:
  qaLocation: docs/qa
prd:
  prdFile: docs/prd.md
  prdVersion: v4
  # PRD monolithique : les 9 épics et leurs stories sont dans docs/prd.md §3
  prdSharded: false
  epicFilePattern: epic-{n}*.md
architecture:
  architectureFile: docs/architecture.md
  architectureVersion: v4
  architectureSharded: true
  architectureShardedLocation: docs/architecture
# Specs de référence du projet (chargées en plus par les agents selon la story)
